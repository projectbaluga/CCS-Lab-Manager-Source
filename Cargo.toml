[package]
name = "ccs-lab-manager"
version = "1.3.0"
edition = "2021"
description = "Computer Laboratory Asset & Maintenance Management System"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
tao = "0.26"
wry = "0.37"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
